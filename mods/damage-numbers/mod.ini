# Cha-Cha mod description (MODS -> Mods)
name = Damage Numbers
name.zh-CN = 伤害数字
author = Cha-Cha
version = 1.0
description = Shows the damage of every hit on a monster over the monster, in the style of MH Wilds, MH Rise or the classic games. Settings are in MODS -> Mods.
description.zh-CN = 在怪物上方显示每次攻击造成的伤害数字，提供《怪物猎人：荒野》、《怪物猎人：崛起》或经典风格。可在“模组与任务 -> 模组”中设置。
