# Cha-Cha mod description (MODS -> Mods)
name = Key Quests
name.zh-CN = 关键任务标记
author = Cha-Cha
version = 1.0
description = Marks the quests you need to progress on the Quest Counter: a gold key for key quests, "2 OF 5" where any few of a group will do, URGENT for urgent quests. Village and Port Tanzia. Optional: off until switched on.
description.zh-CN = 在任务柜台中标记推进主线所需的任务：金色钥匙代表关键任务，“2 OF 5”表示该组中任选指定数量即可，URGENT 代表紧急任务。支持村任务与坦吉亚港。可选模组：默认关闭。
default = off
